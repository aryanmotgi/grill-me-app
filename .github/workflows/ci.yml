name: CI

# Private repo: macOS runner minutes bill at 10x Linux. The web checks run on
# Linux every time; the Rust suite (macOS-only app) runs only when the backend
# actually changed. The MCP server is part of the Rust binary (grill-me --mcp),
# so its end-to-end tests (src/lib/mcpServer.node.test.ts) run in the rust job,
# against the freshly built debug binary.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files via the API
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
              - 'src/lib/mcpServer.node.test.ts'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --exclude src/lib/mcpServer.node.test.ts

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri's build context needs ../dist to exist
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build the app binary (MCP server = grill-me --mcp)
        working-directory: src-tauri
        run: cargo build --locked
      - name: MCP server end-to-end
        run: npx vitest run src/lib/mcpServer.node.test.ts
