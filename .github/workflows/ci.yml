name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # typecheck + bundle (tauri's build context needs ../dist to exist)
      - run: npm run build

      - run: npx vitest run

      - name: MCP server parses
        run: node --check src-tauri/src/grillme-mcp.mjs

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
