name: Release

# Push a tag like v0.2.0 → builds a universal macOS app and attaches the
# .dmg to a DRAFT GitHub release (publish it by hand after a quick check).
#
# Signing + notarization turn on automatically once these repo secrets exist
# (Apple Developer ID, $99/yr). Without them the build is unsigned: it works,
# but macOS Gatekeeper blocks it on other Macs until they allow it manually.
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  the .p12 password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarization (app-specific password)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # only export signing vars that are actually set — an empty
      # APPLE_CERTIFICATE makes the bundler try (and fail) to import it
      - name: Signing (if configured)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "::warning::No Apple signing secrets — building UNSIGNED"; fi

      - uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Grill Me ${{ github.ref_name }}
          releaseBody: |
            Download the .dmg, drag Grill Me to Applications.
            Needs Claude Code installed (`curl -fsSL https://claude.ai/install.sh | bash`).
            First launch: Settings → Setup check shows anything else missing.
          releaseDraft: true
          args: --target universal-apple-darwin
