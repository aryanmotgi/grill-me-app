<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grill Me</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: pointer; user-select: none; -webkit-user-select: none; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #welcome {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px;
        background: rgba(20, 17, 21, .72); border: 1px solid rgba(255, 210, 180, .18);
        -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
        font: 15px "IBM Plex Sans", system-ui, sans-serif; color: #f1ece9; white-space: nowrap; opacity: 0; pointer-events: none;
      }
      #welcome b { font-family: "Chakra Petch", "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 16px; }
      #welcome .sep { color: #7c7674; }
      #welcome .live { display: inline-flex; align-items: center; gap: 7px; color: #a9a2a0; }
      #welcome .live i { width: 8px; height: 8px; border-radius: 50%; background: #4fd18b; box-shadow: 0 0 10px #4fd18b; }
      #caption { position: fixed; left: 50%; transform: translateX(-50%); font: 12px "IBM Plex Mono", ui-monospace, monospace; color: #a9a2a0; opacity: 0; pointer-events: none; white-space: nowrap; }
      #caption b { color: #f2c14e; font-weight: 500; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="caption"></div>
    <div id="welcome"></div>
    <script type="module" src="/src/splash/main.ts"></script>
  </body>
</html>
