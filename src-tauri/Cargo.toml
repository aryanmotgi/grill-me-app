[package]
name = "grill-me"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grill_me_lib"
# desktop only: the bin links the rlib. staticlib/cdylib are for Tauri mobile
# and made every build compile + link the whole crate three times.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
notify = "6"
portable-pty = "0.9"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
window-vibrancy = "0.6"
base64 = "0.22"
# HTTPS to the team relay (rustls, no OpenSSL)
ureq = { version = "2", default-features = false, features = ["tls"] }
# reads Codex/Cargo/pyproject TOML for the workflow scan
toml = "0.8"
tauri-plugin-global-shortcut = "2"


[profile.dev]
incremental = true
# line-tables-only + unpacked split debuginfo: ~40-60% faster macOS links
debug = "line-tables-only"
split-debuginfo = "unpacked"

# dependencies never need debuginfo — big link-time win, they rarely rebuild
[profile.dev.package."*"]
debug = false

# Fast release builds: a desktop UI app gains ~nothing measurable from
# codegen-units=1 + fat LTO, but they made `grill update` take many minutes
# (and an hour on a memory-starved Mac). Parallel codegen, no LTO.
[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true
incremental = true

# the forge's soft blur (macOS vibrancy masked to what it draws) and the
# pill's non-activating panel; same versions window-vibrancy uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSVisualEffectView", "NSImage", "NSGraphics", "NSWindow", "NSPanel"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry", "NSThread"] }
raw-window-handle = "0.6"
